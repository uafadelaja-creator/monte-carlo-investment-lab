<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" role="img" aria-labelledby="title desc">
  <title id="title">Observed versus simulated maximum drawdown</title>
  <desc id="desc">ARKK drawdowns are materially deeper than QUAL and SPY in observed history and the 36-month bootstrap.</desc>
  <rect width="820" height="420" fill="#ffffff"/>
  <text x="44" y="36" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#172033">Observed versus simulated drawdown risk</text>
  <text x="44" y="60" font-family="system-ui,sans-serif" font-size="13" fill="#526079">Percent decline; higher bars are worse.</text>
  <line x1="90" y1="350" x2="780" y2="350" stroke="#8b98ac"/>
  <line x1="90" y1="90" x2="90" y2="350" stroke="#8b98ac"/>
  <g font-family="system-ui,sans-serif" font-size="12" fill="#526079">
    <text x="54" y="354">0%</text><text x="45" y="289">20%</text><text x="45" y="224">40%</text><text x="45" y="159">60%</text><text x="45" y="94">80%</text>
    <line x1="90" y1="285" x2="780" y2="285" stroke="#e1e6ee"/>
    <line x1="90" y1="220" x2="780" y2="220" stroke="#e1e6ee"/>
    <line x1="90" y1="155" x2="780" y2="155" stroke="#e1e6ee"/>
    <line x1="90" y1="90" x2="780" y2="90" stroke="#e1e6ee"/>
  </g>
  <g>
    <rect x="160" y="99.4" width="54" height="250.6" rx="4" fill="#ef6a67"/>
    <rect x="220" y="227.5" width="54" height="122.5" rx="4" fill="#6f8fc9"/>
    <rect x="365" y="259.7" width="54" height="90.3" rx="4" fill="#ef6a67"/>
    <rect x="425" y="303.2" width="54" height="46.8" rx="4" fill="#6f8fc9"/>
    <rect x="570" y="272.3" width="54" height="77.7" rx="4" fill="#ef6a67"/>
    <rect x="630" y="306.5" width="54" height="43.5" rx="4" fill="#6f8fc9"/>
  </g>
  <g font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#172033" text-anchor="middle">
    <text x="187" y="91">77.1%</text><text x="247" y="219">37.7%</text>
    <text x="392" y="251">27.8%</text><text x="452" y="295">14.4%</text>
    <text x="597" y="264">23.9%</text><text x="657" y="298">13.4%</text>
    <text x="217" y="375">ARKK</text><text x="422" y="375">QUAL</text><text x="627" y="375">SPY</text>
  </g>
  <g font-family="system-ui,sans-serif" font-size="12" fill="#526079">
    <rect x="532" y="32" width="14" height="14" rx="2" fill="#ef6a67"/><text x="552" y="44">Observed history</text>
    <rect x="662" y="32" width="14" height="14" rx="2" fill="#6f8fc9"/><text x="682" y="44">36m median</text>
  </g>
  <text x="44" y="406" font-family="system-ui,sans-serif" font-size="11" fill="#6b778c">Observed: Feb 2015–Sep 2026 month-end series. Simulated: 50,000 joint three-month block-bootstrap paths.</text>
</svg>

