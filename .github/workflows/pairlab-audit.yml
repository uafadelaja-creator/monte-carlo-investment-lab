name: PAIR LAB independent audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "stat-arb-dashboard/**"
      - ".github/workflows/pairlab-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate published site and model gates
        run: python stat-arb-dashboard/site_audit.py

      - name: Check browser JavaScript syntax
        run: |
          node -e 'const fs=require("fs");let s=fs.readFileSync("stat-arb-dashboard/index.html","utf8");let js=s.match(/<script>([\s\S]*?)<\/script>/);if(!js)throw Error("Missing inline JS");new Function(js[1]);console.log("PASS: browser JavaScript parses");'

      - name: Check external JavaScript and interactive plan controls
        run: |
          node --check stat-arb-dashboard/charts.js
          node --check stat-arb-dashboard/plans.js
          node stat-arb-dashboard/plans_smoke.test.cjs
          node --check stat-arb-dashboard/daily-ui.js
          node --check stat-arb-dashboard/tradingview.js
          node stat-arb-dashboard/tradingview_smoke.test.cjs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install independent statistical library
        run: python -m pip install -r requirements-ci.txt

      - name: Test daily scanner website usability and verification gate
        run: python -m unittest tests.test_daily_ui -v

      - name: Independently verify latest saved daily discovery data
        run: |
          python audit_daily_scan.py --output /tmp/pairlab-recomputed-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          actual=json.loads(Path("/tmp/pairlab-recomputed-audit.json").read_text())
          published=json.loads(Path("stat-arb-dashboard/data/daily_audit.json").read_text())
          for key in ("status", "scan_sha256", "review_history_sha256", "input_prices_sha256",
                      "all_pairs_enumerated", "all_pairs_recomputed",
                      "legacy_reviews_without_preserved_input"):
              assert actual[key] == published[key], (key, actual[key], published[key])
          print("PASS: published audit matches independent full daily recheck")
          PY

      - name: Recompute entire pair universe independently
        run: >
          python stat-arb-dashboard/recompute_audit.py
          --allow-unadjusted
          --output stat-arb-dashboard/data/independent_audit.json

      - name: Preserve independent audit result
        uses: actions/upload-artifact@v4
        with:
          name: pairlab-independent-audit
          path: stat-arb-dashboard/data/independent_audit.json
          retention-days: 30
