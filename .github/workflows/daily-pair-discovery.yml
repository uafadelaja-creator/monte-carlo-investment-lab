name: PAIR LAB daily pair discovery

on:
  schedule:
    # Every calendar day, after the US equity close: 18:30 ET winter / 19:30 ET summer.
    - cron: "30 23 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "daily_pair_scanner.py"
      - "pair_deep_review.py"
      - "audit_daily_scan.py"
      - "tests/test_daily_audit.py"
      - "tests/test_daily_pair_scanner.py"
      - "tests/test_pair_deep_review.py"
      - "tests/test_daily_ui.py"
      - ".github/workflows/daily-pair-discovery.yml"

permissions:
  contents: write

concurrency:
  group: pairlab-daily-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install scanner dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Test discovery math and fail-closed controls
        run: |
          python -m unittest tests.test_daily_pair_scanner -v
          python -m unittest tests.test_pair_deep_review -v
          python -m unittest tests.test_daily_ui -v
          python -m unittest tests.test_daily_audit -v
          node --check stat-arb-dashboard/daily-ui.js

      - name: Scan peer-sector pairs with fresh adjusted data
        run: python daily_pair_scanner.py

      - name: Independently recompute all model outputs and certify input provenance
        run: python audit_daily_scan.py

      - name: Publish reproducible scan artifact
        uses: actions/upload-artifact@v4
        with:
          name: pairlab-daily-discovery
          path: |
            stat-arb-dashboard/data/daily_discovery.json
            stat-arb-dashboard/data/review_history.json
            stat-arb-dashboard/data/daily_audit.json
            stat-arb-dashboard/data/source-snapshots/*.csv.gz
          if-no-files-found: error
          retention-days: 30

      - name: Commit only validated daily research data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stat-arb-dashboard/data/daily_discovery.json stat-arb-dashboard/data/review_history.json stat-arb-dashboard/data/daily_audit.json stat-arb-dashboard/data/source-snapshots/
          if ! git diff --cached --quiet; then
            git commit -m "data(pairlab): refresh daily discovery research [skip ci]"
            # Source/docs may have advanced while the market-data scan ran.
            # Rebase the new data commit on the newest main; never force-push.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main || {
                echo "::error::Daily data rebase conflict; preserving remote files."
                git rebase --abort || true
                exit 1
              }
              if git push origin HEAD:main; then
                echo "Published daily scan and dated deep-review ledger."
                exit 0
              fi
              echo "Remote advanced during push; retry $attempt / 3"
              sleep 4
            done
            echo "::error::Could not publish after three attempts."
            exit 1
          else
            echo "No new snapshot to commit"
          fi
